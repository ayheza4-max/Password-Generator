<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator | AQM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f43f5e'/%3E%3Cpath d='M35 48 V36 a15 15 0 0 1 30 0 V48' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Crect x='28' y='48' width='44' height='34' rx='7' fill='white'/%3E%3Ccircle cx='50' cy='63' r='4.5' fill='%23f43f5e'/%3E%3Crect x='48' y='65' width='4' height='9' fill='%23f43f5e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a href="https://ayheza4-max.github.io/Ayheza/" class="back">← Back to portfolio</a>
      <h1>Password Generator</h1>
      <p class="sub">Pick your options and generate a secure password.</p>
    </header>

    <div class="card output-card">
      <div class="output-row">
        <output id="output" class="output">Click Generate</output>
        <button id="copy" class="copy" title="Copy" aria-label="Copy password">Copy</button>
      </div>
      <div class="strength">
        <div class="strength-bar"><span id="strengthFill"></span></div>
        <span id="strengthLabel" class="strength-label">—</span>
      </div>
    </div>

    <form id="form" class="card">
      <div class="length-row">
        <label for="length">Length: <strong id="lengthVal">16</strong></label>
        <input type="range" id="length" min="6" max="32" value="16">
      </div>

      <div class="options">
        <label class="opt"><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
        <label class="opt"><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
        <label class="opt"><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
        <label class="opt"><input type="checkbox" id="symbols"> Symbols (!@#$…)</label>
      </div>

      <p id="error" class="error" role="alert"></p>
      <button type="submit" class="btn">Generate password</button>
    </form>

    <footer class="foot">Built by Ayheza Queen S. Morada</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
